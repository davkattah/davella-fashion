version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://davellas_user:davellas_pass@postgres:5432/davellas_db
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: davellas_postgres
    environment:
      POSTGRES_USER: davellas_user
      POSTGRES_PASSWORD: davellas_pass
      POSTGRES_DB: davellas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
